# Clippy reads only the nearest clippy.toml, so the two options of the root file are repeated.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# 003 RF5: the engine is pure. Every rand_core path has `allow-invalid`, so a future rand_core
# that moves or drops an item does not make clippy reject the file (`OsRng`, `from_os_rng` and
# `try_from_os_rng` do not even exist without `os_rng`: the engine alone, the wasm target).
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is not deterministic; use BTreeMap or Vec" },
    { path = "std::collections::HashSet", reason = "iteration order is not deterministic; use BTreeSet or Vec" },
    { path = "std::time::Instant", reason = "the engine has no clock" },
    { path = "std::time::SystemTime", reason = "the engine has no clock" },
    { path = "rand_core::OsRng", reason = "the only randomness is ChaCha20 seeded with the Seed", allow-invalid = true },
    # Phase B (plan-b decision 13): no I/O, processes, network nor threads. A banned type covers
    # all of its methods.
    { path = "std::fs::File", reason = "the engine has no I/O" },
    { path = "std::fs::OpenOptions", reason = "the engine has no I/O" },
    { path = "std::process::Command", reason = "the engine spawns no processes" },
    { path = "std::net::TcpStream", reason = "the engine has no network" },
    { path = "std::net::TcpListener", reason = "the engine has no network" },
    { path = "std::net::UdpSocket", reason = "the engine has no network" },
    { path = "std::thread::Builder", reason = "the engine has no threads" },
    { path = "std::fs::DirBuilder", reason = "the engine has no I/O" },
    # Unix-only: `allow-invalid`, so the wasm and Windows builds of clippy accept the file.
    { path = "std::os::unix::net::UnixStream", reason = "the engine has no network", allow-invalid = true },
    { path = "std::os::unix::net::UnixListener", reason = "the engine has no network", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram", reason = "the engine has no network", allow-invalid = true },
]
disallowed-methods = [
    { path = "rand_core::SeedableRng::from_os_rng", reason = "seed only with Seed (ChaCha20Rng::from_seed)", allow-invalid = true },
    { path = "rand_core::SeedableRng::try_from_os_rng", reason = "seed only with Seed (ChaCha20Rng::from_seed)", allow-invalid = true },
    { path = "rand_core::SeedableRng::from_rng", reason = "seed only with Seed (ChaCha20Rng::from_seed)", allow-invalid = true },
    { path = "rand_core::SeedableRng::try_from_rng", reason = "seed only with Seed (ChaCha20Rng::from_seed)", allow-invalid = true },
    { path = "rand_core::SeedableRng::seed_from_u64", reason = "seed only with Seed (ChaCha20Rng::from_seed)", allow-invalid = true },
    # Phase B (plan-b decision 13): free functions of I/O, environment, threads and stdio. The only
    # legitimate use, regenerating goldens in tests/golden.rs, has a local #[allow] with its reason.
    { path = "std::fs::read", reason = "the engine has no I/O" },
    { path = "std::fs::read_to_string", reason = "the engine has no I/O" },
    { path = "std::fs::read_dir", reason = "the engine has no I/O" },
    { path = "std::fs::write", reason = "the engine has no I/O" },
    { path = "std::fs::metadata", reason = "the engine has no I/O" },
    { path = "std::fs::create_dir_all", reason = "the engine has no I/O" },
    { path = "std::fs::remove_file", reason = "the engine has no I/O" },
    { path = "std::fs::copy", reason = "the engine has no I/O" },
    { path = "std::fs::rename", reason = "the engine has no I/O" },
    { path = "std::fs::create_dir", reason = "the engine has no I/O" },
    { path = "std::fs::remove_dir", reason = "the engine has no I/O" },
    { path = "std::fs::remove_dir_all", reason = "the engine has no I/O" },
    { path = "std::fs::symlink_metadata", reason = "the engine has no I/O" },
    { path = "std::fs::read_link", reason = "the engine has no I/O" },
    { path = "std::fs::hard_link", reason = "the engine has no I/O" },
    { path = "std::fs::canonicalize", reason = "the engine has no I/O" },
    { path = "std::fs::set_permissions", reason = "the engine has no I/O" },
    { path = "std::fs::exists", reason = "the engine has no I/O" },
    { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "the engine has no network (DNS)" },
    # Path methods that touch the file system (a Path itself is allowed: it is only a string).
    { path = "std::path::Path::read_dir", reason = "the engine has no I/O" },
    { path = "std::path::Path::exists", reason = "the engine has no I/O" },
    { path = "std::path::Path::try_exists", reason = "the engine has no I/O" },
    { path = "std::path::Path::metadata", reason = "the engine has no I/O" },
    { path = "std::path::Path::symlink_metadata", reason = "the engine has no I/O" },
    { path = "std::path::Path::canonicalize", reason = "the engine has no I/O" },
    { path = "std::path::Path::read_link", reason = "the engine has no I/O" },
    { path = "std::path::Path::is_file", reason = "the engine has no I/O" },
    { path = "std::path::Path::is_dir", reason = "the engine has no I/O" },
    { path = "std::path::Path::is_symlink", reason = "the engine has no I/O" },
    { path = "std::env::var", reason = "the engine does not read its environment" },
    { path = "std::env::var_os", reason = "the engine does not read its environment" },
    { path = "std::env::vars", reason = "the engine does not read its environment" },
    { path = "std::env::vars_os", reason = "the engine does not read its environment" },
    { path = "std::env::args", reason = "the engine does not read its environment" },
    { path = "std::env::args_os", reason = "the engine does not read its environment" },
    { path = "std::env::current_dir", reason = "the engine does not read its environment" },
    { path = "std::env::current_exe", reason = "the engine does not read its environment" },
    { path = "std::env::temp_dir", reason = "the engine does not read its environment" },
    { path = "std::env::home_dir", reason = "the engine does not read its environment" },
    { path = "std::env::set_var", reason = "the engine does not touch its environment" },
    { path = "std::env::remove_var", reason = "the engine does not touch its environment" },
    { path = "std::env::set_current_dir", reason = "the engine does not touch its environment" },
    { path = "std::thread::spawn", reason = "the engine has no threads" },
    { path = "std::thread::scope", reason = "the engine has no threads" },
    { path = "std::thread::sleep", reason = "the engine has no clock" },
    { path = "std::io::stdin", reason = "the engine has no I/O" },
    { path = "std::io::stdout", reason = "the engine has no I/O" },
    { path = "std::io::stderr", reason = "the engine has no I/O" },
]
