[package]
name = "engine-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

# Workspace lints, so unsafe_code = "forbid": the wasm-bindgen 0.2.129 shim needs no allow
# (003 RF19). scripts/check-engine.mjs fails on any lint table of its own.
[lints]
workspace = true
