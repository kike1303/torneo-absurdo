[package]
name = "engine-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

# Same as [workspace.lints] except `unsafe_code = "deny"`, so the single exported function can
# carry the one local `allow` that RF19 permits for the wasm-bindgen shim (003).
# scripts/check-engine.mjs compares both tables.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
