[package]
name = "engine-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

# Same as [workspace.lints] except `unsafe_code = "deny"`: the wasm-bindgen shim of the single
# exported function needs one local `allow` (003 RF19). scripts/check-engine.mjs compares both.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
