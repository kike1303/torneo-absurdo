packages:
  - apps/web
  - packages/*
  - tools/*

# Supply chain (RF-A1): never install versions published less than 24 h ago.
minimumReleaseAge: 1440

# No dependency may run install scripts. A new dependency that needs them
# breaks `pnpm install` instead of being silently ignored (plan-a, decision 14).
onlyBuiltDependencies: []
strictDepBuilds: true
