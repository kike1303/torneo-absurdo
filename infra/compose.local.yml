# Override of docker-compose.yml for `just prod-local` only (RF-C7). It only adds: the local
# Postgres on `torneo-db` and the ports of `web` and `server` on 127.0.0.1. It never changes the
# images, labels, networks or environment of `web` and `server` (scripts/check-compose.mjs).
# Development credentials only; never production values.

services:
  postgres:
    # Same digest as infra/compose.dev.yml (scripts/check-compose.mjs compares them).
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    # Same tuning (ADR-0006 D4) and log parameters (ADR-0012 A9) as the Coolify Postgres.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=20
      - -c
      - work_mem=4MB
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_duration_sample=-1
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_transaction_sample_rate=0
      - -c
      - log_statement_sample_rate=1
      - -c
      - log_lock_waits=off
    environment:
      POSTGRES_USER: torneo
      POSTGRES_PASSWORD: torneo_local
      POSTGRES_DB: torneo
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - torneo-local-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U torneo -d torneo']
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - torneo-db

  server:
    ports:
      - '127.0.0.1:8080:8080'

  web:
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  torneo-local-pg:
