[workspace]
members = [
    "apps/server",
    "crates/content",
    "crates/engine",
    "crates/engine-wasm",
    "crates/protocol",
    "crates/sim",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false

# Direct dependencies are pinned with `=x.y.z`. Transitive versions are pinned by
# Cargo.lock and must be at least 3 days old (`just crate-age`, plan-b decision 16).
[workspace.dependencies]
protocol = { path = "crates/protocol" }
engine = { path = "crates/engine" }
content = { path = "crates/content" }
# No default features: no `std`, `os_rng` nor `serde` in the engine (003 RF5, RF6).
rand_chacha = { version = "=0.9.0", default-features = false }
wasm-bindgen = "=0.2.129"
axum = { version = "=0.8.9", default-features = false, features = ["form", "http1", "json", "matched-path", "query", "tokio", "ws"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["sensitive-headers", "set-header"] }
hyper = { version = "=1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "server", "service"] }
http-body-util = "=0.1.5"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "uuid"] }
url = "=2.5.8"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ts-rs = "=12.0.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "env-filter", "registry"] }
uuid = { version = "=1.29.0", features = ["v4"] }
mimalloc = "=0.1.52"
thiserror = "=2.0.21"
tokio-tungstenite = "=0.29.0"
# Only to recognise the capacity error behind axum::Error (WebSocket close 1009).
tungstenite = { version = "=0.29.0", default-features = false }
futures-util = "=0.3.34"
# Only for the O_NOFOLLOW / O_NONBLOCK open of crates/content (already in the lock via tokio).
libc = "=0.2.191"
# Rate limiter (008 plan-a decision 6): no quanta, dashmap nor jitter.
governor = { version = "=0.10.4", default-features = false, features = ["std"] }
# Constant-time comparison of X-Internal-Secret (already in the lock via rustls).
subtle = "=2.6.1"
# INTERNAL_API_SECRET decoding (already in the lock via rustls).
base64 = "=0.22.1"
# Session token hashes and ip_hash (008 phase B; already in the lock via sqlx, digest 0.11).
sha2 = "=0.11.1"
hmac = "=0.13.0"
# OsRng for tokens, state, code_verifier and the alias (008 phase B; the line of rand_chacha 0.9).
rand_core = { version = "=0.9.5", default-features = false, features = ["os_rng"] }
# display_name (008 RF-B7): NFC/NFKC, graphemes, UTS #39 skeleton and full case folding.
unicode-normalization = "=0.1.26"
unicode-segmentation = "=1.13.3"
unicode-security = "=0.1.2"
caseless = "=0.2.2"
# OAuth 2.0 client (ADR-0008 D2) without reqwest, curl nor ureq: the HTTP client is ours.
oauth2 = { version = "=5.0.0", default-features = false }
# Property tests of the server (dev-dependency only): no fork, timeout nor tempfile.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# An overflow panics instead of silently diverging between profiles (003 RNF).
[profile.release.package.engine]
overflow-checks = true

# Unoptimised ChaCha makes the engine tests slow in debug; integer results do not change.
[profile.dev.package.rand_chacha]
opt-level = 3

[profile.dev.package.ppv-lite86]
opt-level = 3
