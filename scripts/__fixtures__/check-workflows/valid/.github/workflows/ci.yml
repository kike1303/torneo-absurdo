# Minimal valid ci.yml for check-workflows tests. Not a real workflow.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            web: ['apps/web/**']
            e2e: ['apps/web/**', 'apps/server/**']
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node scripts/check-workflows.mjs
  rust:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - run: echo rust
      - name: The musl binary has no dev-auth
        run: node scripts/check-release-binary.mjs target/x86_64-unknown-linux-musl/debug/server
  web:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Uses a value through env
        env:
          HEAD_REF: ${{ github.head_ref }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$HEAD_REF"
  e2e-server:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Build
        env:
          SOMETHING: else
        run: echo build
  e2e:
    needs: [changes, e2e-server]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: torneo
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: server-dev-auth
          path: bin
      - run: echo e2e
  images:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - run: echo images
      - name: Server binary
        run: node scripts/check-release-binary.mjs "$RUNNER_TEMP/server"
      - name: Health, version and headers (RF-C7)
        run: |
          # ADR-0012 B1 plus B4.6.
          b1="default-src 'self'; script-src 'self' 'nonce-*'; form-action 'self' https://accounts.google.com/o/oauth2/v2/auth https://discord.com/oauth2/authorize; frame-ancestors 'none'"
          echo "$b1"
  ci-ok:
    needs: [changes, policy, rust, web, e2e-server, e2e, images]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: echo "$RESULTS"
