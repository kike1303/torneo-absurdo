# CI of every PR and of every push to main (RF-C8 to RF-C12, ADR-0006 D7, plan-c decisions 14 to
# 19 and 23). `ci-ok` is the only required check: a skipped job counts as success, so a docs-only
# PR finishes with changes + policy + ci-ok.
#
# Policy (scripts/check-workflows.mjs, job `policy`): root permissions contents: read and a closed
# per-job table, actions pinned by SHA, checkout without persisted credentials, no
# continue-on-error, and no ${{ }} inside run: (every value goes through env:).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # main is never cancelled, so its cache warm-up always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      # A push to main diffs against the previous commit with git; a PR uses the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # ADR-0006 D7 plus RF-C8, plan-c decision 16 and the deviations of plan-c (web reads
          # everything that check-web reads: Prettier inputs and check-compose inputs).
          filters: |
            common: &common
              - justfile
              - .github/workflows/**
              - .github/actions/**
            rust:
              - *common
              - crates/**
              - apps/server/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .cargo/**
              - .sqlx/**
              - content/**
              - packages/protocol-ts/**
              - deny.toml
              - clippy.toml
              - infra/compose.dev.yml
              # Run by _check-gen inside check-rust (review of PR #5).
              - scripts/gen-protocol-ts.mjs
              - scripts/compare-trees.mjs
              # Run by _check-engine and _check-wasm inside check-rust (003).
              - scripts/check-engine.mjs
              - scripts/wasi-runner.mjs
              # Embedded by apps/server/src/config.rs with include_str! (008 RF-B18).
              - scripts/__fixtures__/loopback-origins.json
              # Run on the musl binary (008 RF-D9).
              - scripts/check-release-binary.mjs
            web: &web
              - *common
              - apps/web/**
              - packages/**
              - tools/**
              # Read by the sprite importer check inside check-web (007 plan-b decision 27).
              - content/sprites/**
              - content/characters/**
              - crates/content/tests/golden/**
              - docs/guides/**
              - crates/protocol/**
              - crates/engine/**
              - crates/engine-wasm/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .node-version
              - scripts/**
              - .npmrc
              - .prettierrc*
              - .prettierignore
              - eslint.config.*
              - .editorconfig
              - infra/**
              - .dockerignore
              - '**/Dockerfile'
              # The [features] table, read by check-compose (008 RF-D9).
              - apps/server/Cargo.toml
              - rust-toolchain.toml
              - .github/dependabot.yml
            # 008 RF-D9, plan-d decision 12: what the e2e runs (the web and the server with
            # dev-auth). Since 010 the server depends on protocol, engine and content, and it
            # reads content/characters; engine, engine-wasm and those characters already come
            # with web. A balance PR that only touches crates/sim does not run it.
            e2e:
              - *web
              - apps/server/**
              - crates/protocol/**
              - crates/content/**
              - content/names/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .cargo/**
              - .sqlx/**
            images:
              - *common
              - infra/**
              - '**/Dockerfile'
              - .dockerignore
              # The final stage of the server copies it (010 RNF "Imagen").
              - content/characters/**
              - scripts/check-compose.mjs
              - scripts/check-dockerignore.sh
              - scripts/check-release-binary.mjs
              - scripts/fixtures/context.Dockerfile
              - scripts/local-networks.sh
              # Run by _prod-local-start: the generated secrets of prod-local (008 plan-b).
              - scripts/local-secrets.sh
              # The CSP is fixed at build time: the image's /es/ is compared with B1 (ADR-0012).
              - apps/web/vite.config.ts
              - apps/web/vite/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - pnpm-lock.yaml

  # Always runs (no if:), with the minimum: Node, the root dependencies (yaml, vitest) and just.
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/setup-js
        with:
          filter: .
      - name: check-workflows (RF-C12)
        run: node scripts/check-workflows.mjs
      - name: check-workflows tests
        run: pnpm exec vitest run --config scripts/vitest.policy.config.mjs
      - name: just hooks in a temporary clone (RF-C17)
        run: bash scripts/check-hooks.sh

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-just
      # Full install: _check-gen formats with Prettier, whose tailwind plugin resolves apps/web.
      - uses: ./.github/actions/setup-js
      - name: musl-tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools
      - name: Rust toolchain of rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install cargo-deny 0.20.2 (pinned SHA-256)
        run: |
          set -euo pipefail
          version=0.20.2
          sum=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          name="cargo-deny-$version-x86_64-unknown-linux-musl"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$version/$name.tar.gz"
          (cd "$RUNNER_TEMP" && echo "$sum  cargo-deny.tar.gz" | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=1 \
            "$name/cargo-deny"
          rm -f "$RUNNER_TEMP/cargo-deny.tar.gz"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/cargo-deny" --version
      # fmt, clippy, db-up (Postgres of compose.dev.yml, no services:), tests, gen freshness.
      - run: just check-rust
      - run: just deny
      - name: musl build of server (dev profile, RF-C9)
        run: cargo build -p server --locked --target x86_64-unknown-linux-musl
      - name: Static binary (no INTERP, RF-C1)
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/debug/server
          if readelf -lW "$bin" | grep -q INTERP; then
            echo "$bin has an INTERP program header: it is not static" >&2
            exit 1
          fi
          file "$bin"
      # 008 RF-D9 (plan-d decision 12): the strings a release must never carry. `images` does not
      # run on apps/server/src/**, so this is where a dev-auth string outside its #[cfg] fails
      # first. A debug build without features is as strict as the release (LTO removes nothing
      # that is there).
      - name: The musl binary has no dev-auth (RF-D9)
        run: node scripts/check-release-binary.mjs target/x86_64-unknown-linux-musl/debug/server

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/setup-js
      # The scripts/ tests exclude check-workflows (it runs in policy, RF-C10).
      - run: just check-web

  # The server with dev-auth for the e2e (008 plan-d decision 12, ADR-0006 note of 2026-10-30):
  # glibc of Ubuntu 24.04, the same as the noble Playwright image. It reads the `ci` cache of
  # `rust` and never writes it (save-if: false), and defines no CARGO*/CC*/CFLAGS*/CXX*/CMAKE*/
  # RUST* variable of its own, which would change the cache key (check-workflows enforces both).
  e2e-server:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain of rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
          save-if: false
      - name: Server with dev-auth and dev-fights (dev profile)
        run: cargo build -p server --features dev-auth,dev-fights --locked
      - name: The binary is the dev-auth one (RF-D9)
        run: node scripts/check-release-binary.mjs --expect-dev target/debug/server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-dev-auth
          path: target/debug/server
          if-no-files-found: error
          retention-days: 1
          # Re-running every job of a run uploads the same name again (409 without this).
          overwrite: true

  # Runs inside the official Playwright image (plan-c deviation 21): the browsers and their
  # system packages come baked in, so no run depends on the Ubuntu apt mirror nor on the browser
  # download. The image version must equal @playwright/test of the lockfile (checked below);
  # Dependabot does not bump container images, so both move together by hand. Since 008 it also
  # runs the server of e2e-server against a Postgres service (plan-d decision 12).
  e2e:
    needs: [changes, e2e-server]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # The image of infra/compose.dev.yml (check-workflows compares the digest). No POSTGRES_DB:
    # db.mjs creates torneo_e2e from the `postgres` database, and waits for it (services take no
    # options other than --shm-size here). Public e2e credentials, never a secret.
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: torneo
          POSTGRES_PASSWORD: torneo_e2e
    container:
      # mcr.microsoft.com/playwright:v1.64.1-noble, multi-arch index digest (2026-10-23).
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      # Chromium needs a larger /dev/shm than the 64 MB Docker default (Playwright docs). Only
      # --shm-size is allowed by check-workflows, not --ipc=host, which shares the host IPC.
      options: --shm-size=1g
    # Inside a container, run: defaults to `sh -e {0}`: without this, `set -o pipefail` exits 2.
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.64.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-just
      # Node of .node-version (the image ships its own Node, which is not used).
      - uses: ./.github/actions/setup-js
      - name: The image browsers match @playwright/test
        run: |
          set -euo pipefail
          version="$(pnpm --filter web exec playwright --version | awk '{print $2}')"
          if [ "$version" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $version but the e2e image is v$PLAYWRIGHT_IMAGE_VERSION: bump both together" >&2
            exit 1
          fi
          echo "Playwright $version, browsers in ${PLAYWRIGHT_BROWSERS_PATH:?the image sets PLAYWRIGHT_BROWSERS_PATH}"
          ls "$PLAYWRIGHT_BROWSERS_PATH"
      # Only by name and from this run: never run-id, github-token nor repository.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-dev-auth
          path: ${{ runner.temp }}/server-dev-auth
      - name: The downloaded binary is the dev-auth one (RF-D9)
        env:
          E2E_SERVER_BIN: ${{ runner.temp }}/server-dev-auth/server
        run: |
          set -euo pipefail
          chmod +x "$E2E_SERVER_BIN"
          node scripts/check-release-binary.mjs --expect-dev "$E2E_SERVER_BIN"
      # The edge, the server, two webs and the egress proxy, Chromium plus WebKit, desktop and
      # mobile (RF-C10, 008 RF-D7 and RF-D8). A9 is applied to the service with ALTER SYSTEM.
      - name: e2e
        env:
          E2E_DATABASE_URL: postgres://torneo:torneo_e2e@postgres:5432/torneo_e2e
          E2E_SERVER_BIN: ${{ runner.temp }}/server-dev-auth/server
          E2E_APPLY_A9: '1'
        run: just _e2e-run
      # The canaries of the run (session token, user id, alias, dev_identity) stay on the runner:
      # artifacts of a public repo are public (check-workflows enforces the exclusion). The
      # traces of test-results/artifacts, which carry cookies, are never uploaded.
      - name: Upload screenshots and server logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots-and-logs
          path: |
            apps/web/test-results/screenshots
            apps/web/test-results/logs
            !apps/web/test-results/logs/dynamic-canaries.txt
          if-no-files-found: warn
          retention-days: 14

  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04
    # plan-c decision 16: the architect allows up to 35 after the first cold run (deviations).
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      REPO: ghcr.io/kike1303/torneo-absurdo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/setup-js
        with:
          filter: .
      - name: check-compose (RF-C6)
        run: node scripts/check-compose.mjs
      - name: compose config without IMAGE_TAG fails (RF-C4)
        run: |
          set -uo pipefail
          # The secrets and the OAuth credentials of the server are set so IMAGE_TAG is the only
          # missing variable.
          if out="$(env -u IMAGE_TAG INTERNAL_API_SECRET=x IP_HASH_KEY=x \
            GOOGLE_CLIENT_ID=x GOOGLE_CLIENT_SECRET=x DISCORD_CLIENT_ID=x DISCORD_CLIENT_SECRET=x \
            docker compose --env-file infra/local.env -f infra/docker-compose.yml config 2>&1)"; then
            echo "docker compose config succeeded without IMAGE_TAG" >&2
            exit 1
          fi
          if ! grep -q IMAGE_TAG <<<"$out"; then
            echo "the error does not name IMAGE_TAG:" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "fails as expected: $(grep -m1 IMAGE_TAG <<<"$out")"
      - name: .dockerignore with Docker (RF-C3)
        run: bash scripts/check-dockerignore.sh
      - name: Image version
        id: version
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          short="${HEAD_SHA:0:7}"
          [[ "$short" =~ ^[0-9a-f]{7}$ ]] || { echo "bad sha: $short" >&2; exit 1; }
          echo "app_version=sha-$short" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The cache is read by every run and written only by a push to main (RF-C11).
      - name: Build server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ghcr.io/kike1303/torneo-absurdo/server:ci
          build-args: APP_VERSION=${{ steps.version.outputs.app_version }}
          cache-from: type=gha,scope=server
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=server' || '' }}
      - name: Build web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ghcr.io/kike1303/torneo-absurdo/web:ci
          cache-from: type=gha,scope=web
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=web' || '' }}
      - name: Non-root user, Node version, static binary, no dev-auth, no node_modules (RF-C1, RF-C2, RF-D9)
        run: |
          set -euo pipefail
          for svc in server web; do
            user="$(docker inspect -f '{{.Config.User}}' "$REPO/$svc:ci")"
            case "$user" in
              65532 | nonroot) echo "$svc user: $user" ;;
              *) echo "$svc runs as '$user', expected 65532 or nonroot" >&2; exit 1 ;;
            esac
          done
          want="v$(cat .node-version)"
          got="$(docker run --rm "$REPO/web:ci" --version)"
          if [ "$got" != "$want" ]; then
            echo "web image runs Node $got, .node-version says $want" >&2
            exit 1
          fi
          echo "web Node: $got"
          cid="$(docker create "$REPO/server:ci")"
          docker cp "$cid:/server" "$RUNNER_TEMP/server"
          docker rm "$cid" >/dev/null
          if readelf -lW "$RUNNER_TEMP/server" | grep -q INTERP; then
            echo "the server binary has an INTERP program header" >&2
            exit 1
          fi
          file "$RUNNER_TEMP/server"
          # 008 RF-D9: the binary of the image carries none of the dev-auth strings.
          node scripts/check-release-binary.mjs "$RUNNER_TEMP/server"
          cid="$(docker create "$REPO/web:ci")"
          count="$(docker export "$cid" | tar -t | grep -c '^app/node_modules/' || true)"
          docker rm "$cid" >/dev/null
          if [ "$count" != 0 ]; then
            echo "the web image has app/node_modules/ ($count entries)" >&2
            exit 1
          fi
          echo "web image without app/node_modules/"
      - name: Smoke test of the web image alone (RF-C2)
        run: |
          set -euo pipefail
          # A random filler secret and an internal URL nothing listens on (008 decision 12):
          # without a session cookie the web never calls it.
          filler="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
          internal=(-e INTERNAL_API_URL=http://127.0.0.1:9 -e INTERNAL_API_SECRET="$filler")
          cid="$(docker run -d --read-only --cap-drop ALL --security-opt no-new-privileges \
            -p 127.0.0.1:3001:3000 -e PUBLIC_ORIGIN=http://localhost:3001 -e HOST=0.0.0.0 \
            -e PORT=3000 "${internal[@]}" "$REPO/web:ci")"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3001/healthz && break
            sleep 1
          done
          curl -fsS -o /dev/null -w '/healthz %{http_code}\n' http://127.0.0.1:3001/healthz
          curl -fsS -o /dev/null -w '/en/ %{http_code}\n' http://127.0.0.1:3001/en/
          # A broken configuration exits before listening, and for that reason: Kit's env_invalid
          # with the validator's message, not any other crash.
          # start_fails <case> <expected message> [docker run args...]
          start_fails() {
            local name="$1" want="$2" out status
            shift 2
            set +e
            out="$(timeout 60 docker run --rm --name web-start-fails "$@" "$REPO/web:ci" 2>&1)"
            status=$?
            set -e
            docker rm -f web-start-fails >/dev/null 2>&1 || true
            echo "$out"
            if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
              echo "web $name exited with $status, expected a startup failure" >&2
              return 1
            fi
            if ! grep -q 'env_invalid' <<<"$out" || ! grep -qF "$want" <<<"$out"; then
              echo "web $name failed for another reason" >&2
              return 1
            fi
            echo "web $name exits with $status (env_invalid: $want)"
            last_out="$out"
          }
          # The internal variables are set, so the first error is the one of PUBLIC_ORIGIN.
          start_fails 'without PUBLIC_ORIGIN' 'PUBLIC_ORIGIN is required at runtime' "${internal[@]}"
          start_fails 'without INTERNAL_API_SECRET' 'INTERNAL_API_SECRET is required at runtime' \
            -e PUBLIC_ORIGIN=http://localhost:3001 -e INTERNAL_API_URL=http://127.0.0.1:9
          # A malformed secret that is a canary: the validator names the rule, never the value.
          canary="canary-$(node -e "process.stdout.write(require('node:crypto').randomBytes(8).toString('hex'))")!"
          start_fails 'with a malformed secret' 'INTERNAL_API_SECRET must be base64url' \
            -e PUBLIC_ORIGIN=http://localhost:3001 -e INTERNAL_API_URL=http://127.0.0.1:9 \
            -e INTERNAL_API_SECRET="$canary"
          if grep -qF "${canary%!}" <<<"$last_out"; then
            echo "the startup error shows the value of INTERNAL_API_SECRET" >&2
            exit 1
          fi
          echo "the malformed secret does not appear in the output"
      # plan-c decision 16: the production compose plus the local Postgres, in amd64.
      - name: prod-local up
        env:
          IMAGE_TAG: ci
        run: just _prod-local-up
      - name: Health, version and headers (RF-C7)
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          for svc in server web postgres; do
            state="$(docker inspect -f '{{.State.Health.Status}}' "torneo-local-$svc-1")"
            echo "$svc: $state"
            [ "$state" = healthy ] || exit 1
          done
          health="$(curl -fsS http://127.0.0.1:8080/api/health)"
          echo "/api/health: $health"
          version="$(jq -r .version <<<"$health")"
          if [ "$version" != "$APP_VERSION" ]; then
            echo "version is $version, expected $APP_VERSION" >&2
            exit 1
          fi
          curl -fsS -o /dev/null -w '/healthz %{http_code}\n' http://127.0.0.1:3000/healthz
          # ADR-0012 B2: each header exactly once (Traefik is absent here, so this is `handle`).
          # once <url> <status> <name>...
          once() {
            local url="$1" want="$2" headers count name status
            shift 2
            headers="$(curl -sS -I "$url")"
            echo "$headers"
            status="$(head -n 1 <<<"$headers" | tr -d '\r' | awk '{ print $2 }')"
            if [ "$status" != "$want" ]; then
              echo "$url answers $status, expected $want" >&2
              return 1
            fi
            for name in "$@"; do
              count="$(grep -ci "^$name:" <<<"$headers" || true)"
              if [ "$count" != 1 ]; then
                echo "$url sends $name $count times, expected once" >&2
                return 1
              fi
            done
            if grep -i '^strict-transport-security:' <<<"$headers" | grep -Eqi 'includesubdomains|preload'; then
              echo "HSTS must not carry includeSubDomains or preload" >&2
              return 1
            fi
          }
          once http://127.0.0.1:3000/es/ 200 x-content-type-options referrer-policy \
            strict-transport-security cross-origin-opener-policy permissions-policy \
            content-security-policy
          # ADR-0012 B1 plus B4.6 (the 2026-10-30 amendment: the two authorize endpoints in
          # form-action), as this image emits it (nonce normalized; directive and source order
          # ignored). A B4 extension changes this line in its own PR, and the b1= of verify in
          # release.yml with it: check-workflows wants both identical byte for byte (B6.4 item 7).
          csp_norm() {
            tr -d '\r' | sed -E "s/'nonce-[A-Za-z0-9+/_=-]+'/'nonce-*'/g" | tr ';' '\n' |
              while read -r name rest; do
                [ -n "$name" ] || continue
                printf '%s %s\n' "$name" "$(tr ' ' '\n' <<<"$rest" | grep -v '^$' | sort | paste -sd ' ' -)"
              done | sort
          }
          b1="default-src 'self'; script-src 'self' 'nonce-*'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com/o/oauth2/v2/auth https://discord.com/oauth2/authorize; frame-ancestors 'none'"
          csp="$(curl -sS -I http://127.0.0.1:3000/es/ | grep -i '^content-security-policy:' |
            sed 's/^[^:]*:[[:space:]]*//')"
          if ! diff <(csp_norm <<<"$b1") <(csp_norm <<<"$csp"); then
            echo "/es/ CSP is not ADR-0012 B1 plus B4.6: $csp" >&2
            exit 1
          fi
          server_headers=(x-content-type-options strict-transport-security
            cross-origin-resource-policy content-security-policy)
          once http://127.0.0.1:8080/api/health 200 "${server_headers[@]}"
          once http://127.0.0.1:8080/api/nada 404 "${server_headers[@]}"
          # Baseline without Traefik (RF-C7): printed, not asserted.
          curl -sS -I http://127.0.0.1:3000/_app/version.json
          curl -sS -I http://127.0.0.1:3000/healthz/
      - name: Idle memory under the RNF (server < 64 MB, web < 200 MB)
        run: |
          set -euo pipefail
          sleep 30
          stats="$(docker stats --no-stream --format '{{.Name}} {{.MemUsage}}')"
          echo "$stats"
          to_bytes() {
            awk -v v="$1" 'BEGIN {
              n = v; sub(/[A-Za-z]+$/, "", n); u = v; sub(/^[0-9.]+/, "", u)
              m["B"] = 1; m["KiB"] = 1024; m["MiB"] = 1048576; m["GiB"] = 1073741824
              m["kB"] = 1000; m["MB"] = 1000000; m["GB"] = 1000000000
              if (!(u in m) || n == "") exit 1
              printf "%.0f\n", n * m[u]
            }'
          }
          fail=0
          for pair in torneo-local-server-1:64000000 torneo-local-web-1:200000000; do
            name="${pair%%:*}"
            limit="${pair##*:}"
            usage="$(awk -v n="$name" '$1 == n { print $2 }' <<<"$stats")"
            bytes="$(to_bytes "$usage")" || { echo "cannot parse $name usage '$usage'" >&2; exit 1; }
            echo "$name: $bytes B (limit $limit B)"
            if [ "$bytes" -ge "$limit" ]; then
              echo "$name uses $usage at idle, over the RNF" >&2
              fail=1
            fi
          done
          exit "$fail"
      - name: Container logs on failure
        if: failure()
        run: |
          for svc in server web postgres; do
            echo "::group::$svc"
            docker logs "torneo-local-$svc-1" 2>&1 | tail -n 100 || true
            echo "::endgroup::"
          done
      - name: prod-local down
        if: always()
        run: just prod-local-down

  # The only required check (plan-c decision 19): skipped jobs count as success.
  ci-ok:
    needs: [changes, policy, rust, web, e2e-server, e2e, images]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              failure | cancelled) echo "a required job ended in $r" >&2; exit 1 ;;
            esac
          done
