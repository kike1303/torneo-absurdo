[package]
name = "server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
protocol.workspace = true
engine.workspace = true
content.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
sqlx.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
mimalloc.workspace = true
thiserror.workspace = true
tungstenite.workspace = true
governor.workspace = true
subtle.workspace = true
base64.workspace = true
sha2.workspace = true
hmac.workspace = true
rand_core.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
unicode-security.workspace = true
caseless.workspace = true
oauth2.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true

[features]
# The dev OAuth provider and the loopback cookie names (008 RF-B6, RF-B9). Never in `default`
# and never in the release image (RF-D9).
dev-auth = []
# The scripted fights of the integrations and the e2e (010 RF45). The same rules: only on loopback,
# never in `default` and never in the release image.
dev-fights = []

[dev-dependencies]
# RF7: a public verification also runs the bindings a browser would run.
engine-wasm.workspace = true
tokio = { workspace = true, features = ["process", "test-util"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
proptest.workspace = true
rcgen.workspace = true

[lints]
workspace = true
